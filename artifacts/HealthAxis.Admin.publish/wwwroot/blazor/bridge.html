<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Bridge</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #07101f;
      color: #f8f9fa;
      font-family: Arial, sans-serif;
    }
    .message {
      text-align: center;
      max-width: 420px;
      padding: 24px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 24px 60px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>
  <div class="message">
    <h1>Signing in as Admin…</h1>
    <p>Please wait while we redirect you to the admin dashboard.</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('accessToken');

    if (token) {
      localStorage.setItem('accessToken', token);
      window.location.replace('/dashboard');
    } else {
      document.body.innerHTML = '<div class="message"><h1>Admin bridge failed</h1><p>No access token provided.</p></div>';
    }
  </script>
</body>
</html>
