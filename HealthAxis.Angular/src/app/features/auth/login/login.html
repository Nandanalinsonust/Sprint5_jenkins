<div class="login-container">

  <h2>Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="login()">

    <!-- Email -->
    <div>
      <label>Email</label>
      <input type="email" formControlName="email">

      <small *ngIf="submitted && f['email'].errors?.['required']">
        Email is required
      </small>

      <small *ngIf="submitted && f['email'].errors?.['email']">
        Enter valid email
      </small>
    </div>

    <!-- Password -->
    <div>
      <label>Password</label>
      <input type="password" formControlName="password">

      <small *ngIf="submitted && f['password'].errors?.['required']">
        Password is required
      </small>
    </div>

    <!-- Error -->
    <div *ngIf="errorMessage" style="color:red">
      {{ errorMessage }}
    </div>

    <button type="submit">Login</button>

  </form>

</div>
