<div class="container py-4">

  <div class="card shadow-sm">

    <div class="card-body">

      <h3>
        My Appointments
      </h3>

      <table class="table">

        <thead>

          <tr>

            <th>Doctor</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Action</th>

          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let appointment of appointments">

            <td>
              {{ appointment.doctorName || appointment.doctorId }}
            </td>

            <td>
              {{ appointment.scheduledDate | date }}
            </td>

            <td>
              {{ appointment.timeSlot }}
            </td>

            <td>
              {{ appointment.status }}
            </td>

            <td>

              <button
                *ngIf="appointment.status === 'Pending' || appointment.status === 'Confirmed'"
                class="btn btn-danger btn-sm"
                (click)="cancelingId = appointment.appointmentId">

                Cancel

              </button>

            </td>

          </tr>

        </tbody>

      </table>

      <div *ngIf="cancelingId">

        <input
          class="form-control mt-3"
          placeholder="Cancellation reason"
          [(ngModel)]="selectedReason">

        <button
          class="btn btn-danger mt-2"
          (click)="cancelAppointment(cancelingId!)">

          Confirm Cancellation

        </button>

      </div>

    </div>

  </div>

</div>
