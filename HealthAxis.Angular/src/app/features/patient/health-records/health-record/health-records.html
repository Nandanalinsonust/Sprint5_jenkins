<div class="container py-4">

  <div class="card shadow-sm">

    <div class="card-body">

      <h3>
        My Health Records
      </h3>

      <table class="table">

        <thead>

          <tr>

            <th>
              Date
            </th>

            <th>
              Diagnosis
            </th>

            <th>
              Prescription
            </th>

          </tr>

        </thead>

        <tbody>

          <tr *ngFor="let record of records">

            <td>
              {{ record.visitDate | date }}
            </td>

            <td>
              {{ record.diagnosis }}
            </td>

            <td>
              {{ record.prescription }}
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
