<div class="container py-4">

  <div class="card shadow-sm">

    <div class="card-body">

      <h3>
        Find Doctors
      </h3>

      <input
        class="form-control mb-3"
        placeholder="Search Doctor"
        [(ngModel)]="searchTerm"
        (input)="filterDoctors()">

      <div class="row">

        <div
          class="col-md-4 mb-3"
          *ngFor="let doctor of filteredDoctors">

          <div class="card h-100">

            <div class="card-body">

              <h5>
                {{ doctor.fullName }}
              </h5>

              <p>
                {{ doctor.specialisation }}
              </p>

              <p>
                Experience:
                {{ doctor.yearsOfExperience }}
                years
              </p>

              <button
                class="btn btn-primary"
                (click)="bookDoctor(doctor.doctorId)">

                Book Appointment

              </button>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
