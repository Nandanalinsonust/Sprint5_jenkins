<div class="container py-4">

  <div class="card shadow-sm">

    <div class="card-body">

      <h3>
        Patient Profile
      </h3>

      <form
        [formGroup]="profileForm"
        (ngSubmit)="saveProfile()">

        <div class="mb-3">

          <label>
            Patient Name
          </label>

          <input
            class="form-control"
            formControlName="patientName">

        </div>

        <div class="mb-3">

          <label>
            Date Of Birth
          </label>

          <input
            type="date"
            class="form-control"
            formControlName="dateOfBirth">

        </div>

        <div class="mb-3">

          <label>
            Gender
          </label>

          <select
            class="form-select"
            formControlName="gender">

            <option value="Male">
              Male
            </option>

            <option value="Female">
              Female
            </option>

            <option value="Transgender">
              Transgender
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>

        <div class="mb-3">

          <label>
            Email
          </label>

          <input
            class="form-control"
            formControlName="email">

        </div>

        <div class="mb-3">

          <label>
            Phone Number
          </label>

          <input
            class="form-control"
            formControlName="phoneNumber">

        </div>

        <div class="mb-3">

          <label>
            Insurance ID
          </label>

          <input
            class="form-control"
            formControlName="insuranceID">

        </div>

        <button
          class="btn btn-primary">

          Save

        </button>

      </form>

      <div
        class="text-success mt-3"
        *ngIf="message">

        {{ message }}

      </div>

    </div>

  </div>

</div>
