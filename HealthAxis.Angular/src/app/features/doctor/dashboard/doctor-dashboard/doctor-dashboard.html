<div class="container py-4">

  <div class="row g-3">

    <div class="col-md-3">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h3>{{ appointments.length }}</h3>
          <p>Total</p>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h3>{{ pendingCount }}</h3>
          <p>Pending</p>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h3>{{ confirmedCount }}</h3>
          <p>Confirmed</p>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card shadow-sm">
        <div class="card-body text-center">
          <h3>{{ completedCount }}</h3>
          <p>Completed</p>
        </div>
      </div>
    </div>

  </div>

  <div class="card shadow-sm mt-4">

    <div class="card-body">

      <h4>Appointments</h4>

      <table class="table">

        <thead>
          <tr>
            <th>Patient</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let item of appointments">

            <td>
              {{ item.patientName || item.patientId }}
            </td>

            <td>
              {{ item.scheduledDate | date }}
            </td>

            <td>
              {{ item.timeSlot }}
            </td>

            <td>
              {{ item.status }}
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
