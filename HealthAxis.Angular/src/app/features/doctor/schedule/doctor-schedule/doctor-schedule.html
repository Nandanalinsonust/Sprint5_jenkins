<div class="container py-4">

  <div class="card shadow-sm">

    <div class="card-body">

      <h3>
        Doctor Schedule
      </h3>

      <table class="table">

        <thead>

          <tr>

            <th>Patient</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>

          </tr>

        </thead>

        <tbody>

          <tr
            *ngFor="let appointment of appointments">

            <td>
              {{ appointment.patientName || appointment.patientId }}
            </td>

            <td>
              {{ appointment.scheduledDate | date }}
            </td>

            <td>
              {{ appointment.timeSlot }}
            </td>

            <td>
              {{ appointment.status }}
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
