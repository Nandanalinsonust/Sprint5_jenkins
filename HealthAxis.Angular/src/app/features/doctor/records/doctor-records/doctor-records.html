<div class="container py-4">

  <div class="row">

    <div class="col-lg-5">

      <div class="card shadow-sm">

        <div class="card-body">

          <h4>Add Health Record</h4>

          <form
            [formGroup]="form"
            (ngSubmit)="saveRecord()">

            <input
              class="form-control mb-3"
              placeholder="Patient Id"
              formControlName="patientId">

            <input
              class="form-control mb-3"
              placeholder="Appointment Id"
              formControlName="appointmentId">

            <input
              class="form-control mb-3"
              placeholder="Diagnosis"
              formControlName="diagnosis">

            <input
              class="form-control mb-3"
              placeholder="Prescription"
              formControlName="prescription">

            <textarea
              class="form-control mb-3"
              placeholder="Notes"
              formControlName="notes">
            </textarea>

            <button
              class="btn btn-primary">

              Save Record

            </button>

          </form>

          <div
            class="mt-3 text-success">

            {{ message }}

          </div>

        </div>

      </div>

    </div>

    <div class="col-lg-7">

      <div class="card shadow-sm">

        <div class="card-body">

          <h4>Patient Records</h4>

          <table class="table">

            <thead>

              <tr>
                <th>Patient</th>
                <th>Diagnosis</th>
                <th>Prescription</th>
              </tr>

            </thead>

            <tbody>

              <tr *ngFor="let record of records">

               <td>
                 {{ record.patientId }}
               </td>

                <td>
                    {{ record.diagnosis }}
                </td>

               <td>
                  {{ record.prescription }}
               </td>

              </tr>

           </tbody>

          </table>

        </div>

      </div>

   </div>

  </div>

</div>
