<div class="layout-shell">

  <header class="topbar">

    <button
      class="menu-btn"
      (click)="toggleSidebar()">

      ☰

    </button>

    <h3 class="brand">
      Doctor Portal
    </h3>

    <button
      class="logout-btn"
      (click)="logout()">

      Logout

    </button>

  </header>

  <div class="layout-body">

    <aside
      class="sidebar"
      [class.open]="sidebarOpen">

      <a
        routerLink="/doctor/dashboard"
        (click)="sidebarOpen = false">

        Dashboard

      </a>

      <a
        routerLink="/doctor/records"
        (click)="sidebarOpen = false">

        Health Records

      </a>

      <a
        routerLink="/doctor/profile"
        (click)="sidebarOpen = false">

        Profile

      </a>

    </aside>

    <main class="content">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
