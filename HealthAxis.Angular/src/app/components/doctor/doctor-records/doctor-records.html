<div class="container py-4">
  <div class="row g-4">
    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="text-primary">Add Health Record</h4>
          <form [formGroup]="form" (ngSubmit)="saveRecord()">
            <div class="mb-3">
              <label class="form-label">Patient ID</label>
              <input class="form-control" formControlName="patientId" />
            </div>
            <div class="mb-3">
              <label class="form-label">Appointment ID</label>
              <input class="form-control" formControlName="appointmentId" />
            </div>
            <div class="mb-3">
              <label class="form-label">Diagnosis</label>
              <input class="form-control" formControlName="diagnosis" />
            </div>
            <div class="mb-3">
              <label class="form-label">Prescription</label>
              <input class="form-control" formControlName="prescription" />
            </div>
            <div class="mb-3">
              <label class="form-label">Notes</label>
              <textarea class="form-control" formControlName="notes"></textarea>
            </div>
            <button class="btn btn-primary">Save Record</button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-lg-7">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="text-primary">Patient Records</h4>
          <div class="table-responsive">
            <table class="table table-bordered">
              <thead>
                <tr>
                  <th>Patient</th>
                  <th>Diagnosis</th>
                  <th>Prescription</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of records">
                  <td>{{ item.patientId }}</td>
                  <td>{{ item.diagnosis }}</td>
                  <td>{{ item.prescription }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
