<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="text-primary">Set your password</h3>
          <p class="text-muted">This first login requires a secure password update before you continue.</p>
          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label">Current password</label>
              <input type="password" class="form-control" formControlName="oldPassword" />
            </div>
            <div class="mb-3">
              <label class="form-label">New password</label>
              <input type="password" class="form-control" formControlName="newPassword" />
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm password</label>
              <input type="password" class="form-control" formControlName="confirmPassword" />
            </div>
            <button class="btn btn-primary w-100">Save password</button>
          </form>
          <div class="text-danger mt-3" *ngIf="message">{{ message }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
