<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="text-primary">My Appointments</h3>
      <div class="table-responsive mt-3">
        <table class="table table-bordered align-middle">
          <thead>
            <tr>
              <th>Doctor</th>
              <th>Date</th>
              <th>Time</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of pagedAppointments">
              <td>{{ item.doctorId }}</td>
              <td>{{ item.scheduledDate | date }}</td>
              <td>{{ item.timeSlot }}</td>
              <td><span class="badge bg-info text-dark">{{ item.status }}</span></td>
              <td>
                <button class="btn btn-sm btn-outline-danger" (click)="cancelingId = item.appointmentId">Cancel</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3" *ngIf="totalPages() > 1">
        <button class="btn btn-outline-secondary btn-sm" [disabled]="page === 1" (click)="page = page - 1">Previous</button>
        <span>Page {{ page }} of {{ totalPages() }}</span>
        <button class="btn btn-outline-secondary btn-sm" [disabled]="page === totalPages()" (click)="page = page + 1">Next</button>
      </div>
      <div class="mt-3" *ngIf="cancelingId">
        <input class="form-control" placeholder="Reason for cancellation" [(ngModel)]="selectedReason" />
        <button class="btn btn-danger mt-2" (click)="cancelAppointment(cancelingId)">Confirm Cancel</button>
      </div>
    </div>
  </div>
</div>
