<div class="patient-shell">
  <div class="topbar">
    <button class="menu-btn" (click)="toggleSidebar()">☰</button>
    <div class="brand">HealthAxis</div>
    <div class="topbar-actions">
      <button class="logout-btn" (click)="logout()">Logout</button>
    </div>
  </div>

  <div class="body-area">
    <aside class="sidebar" [class.open]="sidebarOpen">
      <a routerLink="/patient/dashboard" (click)="sidebarOpen = false">Dashboard</a>
      <a routerLink="/patient/profile" (click)="sidebarOpen = false">My Profile</a>
      <a routerLink="/patient/doctors" (click)="sidebarOpen = false">Doctors</a>
      <a routerLink="/patient/book-appointment" (click)="sidebarOpen = false">Book Appointment</a>
      <a routerLink="/patient/appointments" (click)="sidebarOpen = false">My Appointments</a>
      <a routerLink="/patient/health-records" (click)="sidebarOpen = false">My Health Records</a>
    </aside>

    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
