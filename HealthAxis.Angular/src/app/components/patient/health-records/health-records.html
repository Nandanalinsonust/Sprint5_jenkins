<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="text-primary mb-0">My Health Records</h3>
        <input class="form-control w-auto" placeholder="Search diagnosis or prescription" [(ngModel)]="searchTerm" (ngModelChange)="filterRecords()" />
      </div>

      <div class="row g-3">
        <div class="col-12" *ngFor="let record of pagedRecords">
          <div class="border rounded p-3">
            <div class="d-flex justify-content-between">
              <h5 class="mb-1">{{ record.diagnosis }}</h5>
              <span class="text-muted">{{ record.visitDate | date }}</span>
            </div>
            <p class="mb-1"><strong>Prescription:</strong> {{ record.prescription }}</p>
            <p class="mb-0"><strong>Notes:</strong> {{ record.notes || 'No notes provided.' }}</p>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <button class="btn btn-outline-secondary btn-sm" [disabled]="page === 1" (click)="page = page - 1">Previous</button>
        <span>Page {{ page }} of {{ totalPages() }}</span>
        <button class="btn btn-outline-secondary btn-sm" [disabled]="page === totalPages()" (click)="page = page + 1">Next</button>
      </div>
    </div>
  </div>
</div>
