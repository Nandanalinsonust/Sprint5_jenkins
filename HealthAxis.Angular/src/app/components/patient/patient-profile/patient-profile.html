<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="text-primary">Edit Patient Profile</h3>
          <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input class="form-control" formControlName="fullName" />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input class="form-control" formControlName="email" />
            </div>
            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input class="form-control" formControlName="phoneNumber" />
            </div>
            <div class="mb-3">
              <label class="form-label">Gender</label>
              <select class="form-select" formControlName="gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Transgender">Transgender</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Insurance ID</label>
              <input class="form-control" formControlName="insuranceID" />
            </div>
            <button class="btn btn-primary">Save</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
