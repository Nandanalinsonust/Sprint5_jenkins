<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="text-primary">Complete your patient profile</h3>
          <p class="text-muted">Fill in your details so we can personalize your dashboard.</p>

          <form [formGroup]="profileForm" (ngSubmit)="save()">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input class="form-control" formControlName="fullName" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" formControlName="email" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control" formControlName="dateOfBirth" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Gender</label>
                <select class="form-select" formControlName="gender">
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Transgender">Transgender</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Phone Number</label>
                <input class="form-control" formControlName="phoneNumber" />
              </div>
              <div class="col-12">
                <label class="form-label">Insurance ID</label>
                <input class="form-control" formControlName="insuranceID" />
              </div>
            </div>

            <button class="btn btn-primary mt-4 w-100">Save profile</button>
          </form>

          <div class="text-danger mt-3" *ngIf="message">{{ message }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
