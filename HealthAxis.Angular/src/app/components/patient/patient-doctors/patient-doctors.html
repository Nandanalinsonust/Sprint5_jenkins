<div class="container py-4">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="text-primary">Doctor Discovery</h3>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <input class="form-control" placeholder="Search by doctor name" [(ngModel)]="searchTerm" (ngModelChange)="filterDoctors()" />
        </div>
        <div class="col-md-6">
          <select class="form-select" [(ngModel)]="selectedSpecialisation" (change)="filterDoctors()">
            <option value="">All Specialisations</option>
            <option value="Cardiologist">Cardiologist</option>
            <option value="Dermatologist">Dermatologist</option>
            <option value="Neurologist">Neurologist</option>
            <option value="Pediatrician">Pediatrician</option>
            <option value="Psychiatrist">Psychiatrist</option>
          </select>
        </div>
      </div>
      <div class="row g-3">
        <div class="col-lg-4" *ngFor="let doctor of filteredDoctors">
          <div class="card border-primary h-100">
            <div class="card-body">
              <h5>{{ doctor.fullName }}</h5>
              <p class="mb-1"><strong>Specialisation:</strong> {{ doctor.specialisation }}</p>
              <p class="mb-1"><strong>Experience:</strong> {{ doctor.yearsOfExperience }} years</p>
              <p class="mb-1"><strong>Fee:</strong> ₹{{ doctor.consultationFee }}</p>
              <button class="btn btn-primary mt-2 me-2" (click)="selectedDoctorId = doctor.doctorId">Book here</button>
              <button class="btn btn-outline-primary mt-2" (click)="quickBook(doctor.doctorId)">Book slot</button>
            </div>
          </div>
        </div>
      </div>
      <div class="mt-4" *ngIf="selectedDoctorId">
        <h5>Book Appointment</h5>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" [(ngModel)]="selectedDate" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Slot</label>
            <input class="form-control" placeholder="09:00-09:30" [(ngModel)]="selectedSlot" />
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button class="btn btn-success w-100" (click)="bookAppointment()">Confirm Booking</button>
          </div>
        </div>
        <div class="text-success mt-3" *ngIf="message">{{ message }}</div>
      </div>
    </div>
  </div>
</div>
