<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="text-primary mb-3">Patient Registration</h3>
          <form [formGroup]="registerForm" (ngSubmit)="handleRegister()">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" formControlName="email" />
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" formControlName="password" />
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm Password</label>
              <input type="password" class="form-control" formControlName="confirmPassword" />
            </div>
            <button class="btn btn-primary w-100">Create account</button>
          </form>
          <div class="text-danger mt-3" *ngIf="errorMessage">{{ errorMessage }}</div>
          <div class="text-success mt-3" *ngIf="successMessage">{{ successMessage }}</div>
          <div class="mt-3 text-center">
            <a routerLink="/login">Already have an account? Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
